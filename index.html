<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Removed the landscape lock so it opens perfectly in portrait -->
    <title>Login to Your Gift</title>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Quicksand:400,600,700");

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #051024, #0a2342, #173f5f);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; /* Prevents scrollbars when icons hit the edge */
            position: relative;
            color: #fff;
        }

        .header {
            display: flex;
            align-items: center;
            flex-direction: column;
            text-align: center;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-in-out;
            z-index: 10;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .header h1 {
            color: #fff;
            font-size: 28px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin: 10px 0 15px 0;
            font-weight: 700;
        }

        .avatar {
            background-color: rgba(255, 255, 255, 0.1);
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(224, 242, 254, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transform: rotate(18deg) scale(1.1); /* Slight zoom for better fit */
            object-fit: cover;
        }

        /* Glassmorphism Mobile-Optimized Login Container */
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 25px;
            border-radius: 24px; /* Softer, modern round corners */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 85%; /* Perfect for mobile screens */
            max-width: 360px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h2 {
            text-align: center;
            color: #e0f2fe; 
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e0f2fe;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding-left: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; /* Gen-Z friendly soft inputs */
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #e0f2fe;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 12px rgba(224, 242, 254, 0.3);
        }

        .login-button {
            width: 100%;
            background: linear-gradient(135deg, #173f5f, #0a2342); /* Deep rich gradient */
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 16px;
            border-radius: 30px; /* Fully pill-shaped button */
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
        }

        .login-button:active {
            transform: translateY(2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #error {
            color: #ff6b6b; 
            font-size: 14px;
            margin-top: 15px;
            font-weight: 600;
        }

        #error h1 {
            font-size: 15px;
            margin: 0;
        }

        .balloon {
            position: fixed;
            width: 70px;
            height: 70px;
            bottom: 25px;
            right: 25px; /* Moved to right so it doesn't block icons */
            z-index: 4;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0); }
        }

        /* THE ORBITING MAKEUP TRAIL (Mobile Optimized) */
        .makeup-icons-wrapper {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Crucial: Lets you click the login box! */
            z-index: 5;
        }

        .makeup-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 38px; /* Perfectly sized for mobile edges */
            height: 38px;
            opacity: 0.9;
            animation: tailOrbitMobile 16s linear infinite, sparkleGlow 2s ease-in-out infinite;
        }

        /* Perfect spacing for the train effect */
        .makeup-icon:nth-child(1) { animation-delay: 0s, 0s; }
        .makeup-icon:nth-child(2) { animation-delay: -1.0s, 0.4s; }
        .makeup-icon:nth-child(3) { animation-delay: -2.0s, 0.8s; }
        .makeup-icon:nth-child(4) { animation-delay: -3.0s, 1.2s; }
        .makeup-icon:nth-child(5) { animation-delay: -4.0s, 1.6s; }
        .makeup-icon:nth-child(6) { animation-delay: -5.0s, 2.0s; }

        /* Dynamically calculates phone height/width so it never breaks off screen */
        @keyframes tailOrbitMobile {
            0%   { transform: translate(10px, 10px) rotate(0deg); }
            25%  { transform: translate(calc(100vw - 48px), 10px) rotate(90deg); }
            50%  { transform: translate(calc(100vw - 48px), calc(100vh - 48px)) rotate(180deg); }
            75%  { transform: translate(10px, calc(100vh - 48px)) rotate(270deg); }
            100% { transform: translate(10px, 10px) rotate(360deg); }
        }

        @keyframes sparkleGlow {
            0% { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)) brightness(1); }
            50% { filter: drop-shadow(0 4px 12px rgba(224,242,254,0.6)) brightness(1.2); }
            100% { filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)) brightness(1); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Happy 19th Birthday, Baby 🎉</h1>
        <div class="avatar">
            <img src="images/grok.png" alt="Naina">
        </div>
    </div>
    
    <div class="container">
        <h2>Login</h2>
        <form action="#">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" maxlength="20" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" onclick="main(event)" class="login-button">Log In</button>
            <div id="error"></div>
        </form>
    </div>

    <img src="images/balloon.webp" alt="Balloon" class="balloon">
    
    <!-- Floating orbiting tail -->
    <div class="makeup-icons-wrapper">
        <img src="images/lipstick.avif" alt="Lipstick" class="makeup-icon">
        <img src="images/blush.jpg" alt="Blush" class="makeup-icon">
        <img src="images/eyeshadow.avif" alt="Eyeshadow" class="makeup-icon">
        <img src="images/perfume.png" alt="Perfume" class="makeup-icon">
        <img src="images/sunscreen.png" alt="Sunscreen" class="makeup-icon">
        <img src="images/foundation.avif" alt="Foundation" class="makeup-icon">
    </div>

    <script>
        function main(e){
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            
            if (username === "niharika" && password === "varun"){
                window.location = "main.html";
            }
            else {
                const error = document.getElementById("error");
                error.innerHTML = "<h1>Oops! Wrong credentials 😂</h1>";
                alert("pata tha mujhe isliye ye aasan password banaya tha 😂");
                setTimeout(()=>{
                    error.innerHTML = "";
                }, 5000);
            }
        }
    </script>
</body>
</html>
